name: Bug report
description: Report a reproducible D3D rendering or gameplay regression.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        D3D currently targets Tristram. Home uses the actual original backend; rotated or forced-geometry views test reconstruction. Do not upload game archives, extracted artwork, saves or secrets. Português: descreva o erro e como reproduzi-lo; não envie os arquivos do Diablo nem chaves.
  - type: input
    id: version
    attributes:
      label: Build or commit
      description: Include the executable version or commit and whether you built it yourself.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and game data
      description: OS, viewport/resolution, retail or shareware, game-data edition, and relevant settings. Keep personal paths private.
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: View where the bug occurs
      options:
        - Original view (F4 off)
        - 3D mode at Home (original backend)
        - Rotated or changed 3D camera (meshes)
        - Forced-geometry diagnostic at native angle
        - Multiple views or unsure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include town/object coordinates if known, camera controls, actor motion and any open panels.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain the visible defect or gameplay regression and whether it persists after F4/Home.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and logs
      description: Attach only evidence you may publish. Label original-backend and forced-mesh captures separately; remove secrets and personal information from logs.
  - type: checkboxes
    id: data
    attributes:
      label: Included data
      options:
        - label: I have not attached game archives, extracted proprietary assets, player saves or credentials.
          required: true
