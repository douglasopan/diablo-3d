name: D3D website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'Source/engine/music_catalog.hpp'
      - 'docs/devlog/**'
      - 'docs/hud-study/r2/**'
      - 'docs/hud-study/images/06-menu-principal-preview.jpg'
      - 'docs/DEVLOG.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'Source/engine/music_catalog.hpp'
      - 'docs/devlog/**'
      - 'docs/hud-study/r2/**'
      - 'docs/hud-study/images/06-menu-principal-preview.jpg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install website dependencies
        run: python -m pip install -r website/requirements.txt
      - name: Ensure audio verification is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Build static pages
        run: python website/build.py
      - name: Check authoring contract
        run: python -m unittest discover -s website -p 'test_*.py'
      - name: Verify artifact
        run: python website/verify.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
